# Training arguments — DevFiles/Specs.md section 5 starting config.
# bf16 not fp16: fp16 requires torch's GradScaler, which crashed
# ("not implemented for BFloat16") because TinyLlama-1.1B-Chat-v1.0's
# checkpoint has some layers natively in bf16 and mixing fp16-scaled
# gradients with bf16 params breaks the scaler. bf16 training needs no
# loss scaling at all, sidestepping the issue. MX450 (Turing, compute
# cap 7.5) reports bf16 support via torch.cuda.is_bf16_supported() —
# software-emulated (no native bf16 tensor cores), works but not fast.
num_train_epochs: 3
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
fp16: false
bf16: true
logging_steps: 10
# Note: train_adapter.py hardcodes save_strategy="steps"/save_steps=15
# regardless of this value — a full epoch-boundary-only checkpoint scheme
# lost an entire hour of r=16 training to an unexplained crash (GPU driver
# reset under thermal load, no traceback) before the first epoch checkpoint
# at step 63. This field is kept for reference/spec-alignment but is
# overridden in code.
save_strategy: "epoch"

# --- added 2026-09-10: evaluation and schedule ------------------------------
# The original 8 adapters were trained without these (no held-out set, linear
# decay, no warmup, loss logged every 10 of 24 steps). They only take effect
# when a held-out split exists -- see training/make_split.py -- so rerunning
# with --no-holdout reproduces the original configuration.
warmup_ratio: 0.1
lr_scheduler_type: "cosine"
weight_decay: 0.0
eval_steps: 2
logging_steps_eval: 2
